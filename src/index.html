<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>character-customizer</title>
		<link rel="stylesheet" href="./style.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap"
			rel="stylesheet"
		/>

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>

		<link rel="icon" href="/favicon.png" type="image/x-icon" />

		<style>
			#loading-screen {
				position: fixed;
				width: 100%;
				height: 100%;
				background-color: #000;
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 9999;
			}
			#progress-bar {
				width: 80%;
				height: 20px;
				background-color: #444;
			}
			#progress {
				height: 100%;
				width: 0;
				background-color: #00f;
				transition: width 0.5s ease; /* Add this line */
			}
		</style>

		<style>
			.percentage-holder {
				height: 100%;
				width: 100%;

				position: fixed;
				/* top: 50%;
				left: 50%; */
				z-index: 5000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;

				font-size: 1rem;
				font-weight: bold;
				background-color: black;
				opacity: 1;
				color: ivory;
			}
			#percentage {
				font-weight: bold;
			}
			.percentage-animation {
				animation: fadeInOut 1.5s;
			}
			@keyframes fadeInOut {
				0% {
					opacity: 0;
				}
				25% {
					opacity: 0.5;
				}
				50% {
					opacity: 1;
				}
				75% {
					opacity: 0.5;
				}
				100% {
					opacity: 0;
				}
			}
			.toggle-collapse span {
				color: #007bff;
			}

			.loading-gif {
				height: 50%;
				width: 50%;

				/* border: 1px solid red; */

				background-size: contain;
				/* background-attachment: fixed; */
				background-position: center;
				background-repeat: no-repeat;
			}
		</style>
	</head>
	<body>
		<div class="percentage-holder" id="percentage-holder">
			<div id="percentage" style="display: none">0%</div>

			<div class="loading-gif" id="loading-gif"></div>
			LOADING ...
		</div>

		<!-- <div id="loading-screen">
			<div id="progress-bar">
				<div id="progress"></div>
			</div>
		</div> -->

		<div id="screenshotable">
			<canvas id="webgl" class="webgl"> </canvas>
			<div class="clothing-names" id="clothing-names"></div>
		</div>

		<button class="toggle-collapse" id="toggle-collapse">
			<span class="material-symbols-outlined" id="toggle-collapse-icon">
				chevron_left
			</span>
		</button>
		<div
			class="avatar-customizer-ui collapsed unselectable"
			id="avatar-customizer-ui"
		>
			<div class="ui" id="ui"></div>
		</div>

		<!-- <div class="color-picker-container" id="color-picker-container">
			<div class="color-picker-component" id="color-picker-component">
				<label
					class="color-picker-label"
					id="color-picker-label"
					for="color-picker"
					>LABEL</label
				>
				<input class="color-picker" id="color-picker" type="color" />
			</div>
		</div> -->

		<div class="buttons-container unselectable">
			<div style="display: flex; gap: 4px" id="mini-music-player">
				<button id="startAudio">
					<span class="material-symbols-outlined" id="audio-play-icon">
						play_arrow
					</span>
				</button>
				<button id="muteAudio">
					<span class="material-symbols-outlined" id="audio-mute-icon">
						volume_up
					</span>
				</button>
				<div class="range-container">
					<input type="range" id="volumeControl" min="0" max="100" value="30" />
				</div>
			</div>

			<button id="sampleAnimationBtn">
				<span class="material-symbols-outlined"> sports_martial_arts </span>
			</button>
			<button class="customization-done" id="take-screenshot">
				<span class="material-symbols-outlined" style="font-size: 36px">
					photo_camera
				</span>
			</button>
			<button id="reset">
				<span class="material-symbols-outlined"> restart_alt </span>
			</button>
		</div>

		<div id="winamp-container"></div>

		<script type="module" src="./script.js"></script>
	</body>
</html>
