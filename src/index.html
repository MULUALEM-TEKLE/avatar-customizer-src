<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>

		<title>Avatar Customizer — Bilal</title>
		<meta
			name="description"
			content="Dress a 3D character from a configurable wardrobe, pose it, and capture the look."
		/>
		<meta name="theme-color" content="#0b0c0d" />

		<link rel="stylesheet" href="./style.css" />
		<link rel="icon" href="/favicon.png" type="image/png" />

		<!-- Fonts are self-hosted (static/fonts): no third-party request can
		     leave the console showing glyph names in front of a client. -->
		<link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/material-symbols-subset.woff2" crossorigin />

		<link rel="preload" as="image" href="/loader.webp" />
		<link rel="preload" as="fetch" href="/models/bilal.glb" crossorigin />
	</head>

	<body>
		<h1 class="sr-only">Avatar Customizer</h1>

		<!-- Markup, not JS, so the first paint happens before any script runs. -->
		<div class="loading" id="loading">
			<header class="loading__head">
				<p class="loading__mark">Bilal</p>
				<p class="loading__strap">
					Autumn/Winter — a configurable wardrobe.
				</p>
			</header>

			<!-- The figure's silhouette, traced from the model by scripts/trace-outline.mjs
			     in view-plane units, so it sits exactly where the camera will put the
			     model on any screen: CSS places it for the default lens before any script
			     runs, loadingScreen.track() then pins it to the live projection. Three
			     strokes of one path: a pencil pass, the ink, and the pen tip leading it. -->
			<div class="loading__figure" id="loading-figure" style="--lo-x: -130.8; --lo-y: -266.4; --lo-w: 253.7; --lo-h: 567.4" aria-hidden="true">
				<svg class="loading__sketch" viewBox="-130.8 -266.4 253.7 567.4" preserveAspectRatio="none">
					<path id="loading-outline" pathLength="1" fill-rule="evenodd" d="M-0.1 -266.4 9 -264.9 14.5 -261.8 19 -258.2 21.8 -254.6 24 -249.1 25 -244.5 25.4 -233.6 29.1 -232.7 30.3 -230 30.3 -226.3 27.2 -217.2 26.3 -216.6 23.6 -216.8 22.1 -214.5 20.6 -207.2 20.3 -199.9 20.9 -199.3 27.2 -199.3 29.1 -198.7 39.1 -199.3 48.2 -196.3 49.6 -194.4 50.9 -190.2 53.7 -189.4 55.5 -190.3 57.3 -190.2 62.3 -186.2 61.9 -184.4 60.3 -183.5 67.3 -179.6 79.2 -166.2 106.2 -119.8 113.3 -86.1 116.5 -78.8 118.6 -71.5 121.7 -47.8 122.9 -19.6 120.8 15.9 120.2 17.8 115.6 21.7 112.9 22.6 108.3 23.2 93.7 27.3 82.8 28.7 81.9 29.6 79.2 28.7 79.2 26.9 77.3 25.7 72.8 24.4 69.1 21.7 60.9 24.1 56.4 22.9 54.1 23.2 55.5 56.9 56.7 67.9 55.8 77 58.8 89.7 58.2 111.6 55.2 125.2 58.5 136.2 56.8 142.5 61.6 150.7 62.2 161.7 59.4 191.7 55.8 218.1 53.4 227.2 53.2 240.9 55.5 247.3 59.1 251.8 68.2 259.1 77.3 269.1 79.2 272.8 81.4 281 81.3 289.2 79.5 294.6 77.3 295.8 61.9 296.9 39.1 299.8 38.2 298.6 35.4 298.3 31.8 294.6 27.2 287.3 21.8 286.4 18.6 282.8 15.9 272.8 17.5 250.9 17.5 235.4 16.3 222.7 10.8 195.4 8.6 164.4 8.1 150.7 10.8 140.7 4.2 134.3 3.2 132.5 3.9 129.8 3.9 105.2 2.2 88.8 -0.4 74.2 -1.3 57.8 -2.8 51 -6.2 73.3 -9.5 88.8 -9.8 96.1 -15.3 120.7 -20.7 132.5 -27.7 138.9 -28.6 140.7 -25.6 141.6 -24.1 149.8 -24.4 157.1 -29.9 198.1 -33.5 212.7 -37.1 223.6 -38.7 233.6 -38.8 250 -37.4 270 -39 279.1 -40.8 283.7 -42 285.2 -42.9 285.2 -47.5 288.6 -52.9 287.8 -54.7 288.3 -61.1 296.9 -65.7 299.6 -69.3 299.8 -70.2 301 -93 297.1 -105.8 295.8 -108.5 294.6 -110.3 288.3 -110.8 281.9 -110.6 279.1 -108.8 273.7 -106.1 268.2 -96.7 259.4 -86.6 253 -80 246.4 -76.6 238.2 -76 226.3 -79.6 182.6 -79.6 161.7 -78 146.2 -71.5 138.9 -73.3 121.6 -72.7 94.3 -69.9 82.4 -68.7 66 -63.6 41.4 -61.4 25 -59.9 19.6 -72.1 13.2 -75.7 5.9 -77.8 9.6 -83 15 -88.5 16.4 -94.8 16.2 -96.7 17.8 -97.6 21.1 -100.3 20.8 -103 17.8 -104.9 16.9 -111.2 17.5 -114 13.8 -124 10.8 -129.5 5 -130.8 2.3 -130.7 -7.7 -127.3 -23.2 -119.7 -73.3 -114.3 -95.2 -110 -104.3 -107.9 -115.2 -104.2 -124.3 -101.5 -134.3 -90 -148 -79.3 -164.4 -71.2 -174.4 -59.3 -183.1 -59 -185.3 -55.7 -189 -54.7 -189.3 -52.9 -187.2 -52 -187.2 -49.3 -188.5 -43.8 -189.4 -38 -197.2 -36.5 -198.1 -33.8 -198.4 -32 -197.8 -13.8 -199 -14.2 -204.5 -18.3 -211.8 -18.8 -214.5 -21.5 -215.4 -24.2 -224.5 -24.2 -230 -22.9 -231.3 -21 -230.9 -20.6 -232.7 -21 -245.4 -20.4 -250 -18.6 -254.6 -15.6 -259.1 -7.4 -264.6Z" />
					<use class="loading__pencil" href="#loading-outline" />
					<use class="loading__ink" href="#loading-outline" />
					<use class="loading__tip" href="#loading-outline" />
				</svg>
			</div>
			<script>
				// The last session's own silhouette, traced by the app and saved with
				// the outfit (script.js persistSession), replaces the baked default
				// before the first paint. The app mirrors the session into the hash,
				// so a hash that names this outfit and pose is still this session; a
				// shared link with another outfit, or an asked pose (?p=), is not, and
				// those keep the default and are traced live.
				try {
					const saved = JSON.parse(localStorage.getItem("avatar-customizer:v1"))
					const hash = new URLSearchParams(location.hash.slice(1))
					const outfit = hash.get("o")
					const pose = new URLSearchParams(location.search).get("p") || hash.get("p")
					if (saved && (!outfit || outfit === saved.outfit) && (!pose || pose === saved.pose)) {
						const o = saved.outline
						if (o && typeof o.d === "string" && Array.isArray(o.box) && o.box.length === 4) {
							const figure = document.getElementById("loading-figure")
							figure.querySelector("path").setAttribute("d", o.d)
							figure.querySelector("svg").setAttribute("viewBox", o.box.join(" "))
							figure.style.cssText = "--lo-x:" + o.box[0] + ";--lo-y:" + o.box[1] + ";--lo-w:" + o.box[2] + ";--lo-h:" + o.box[3]
							figure.dataset.cached = "1"
						}
					}
				} catch (_) {}
			</script>

			<div class="loading__meter">
				<div class="loading__pct" id="loading-percent" aria-hidden="true">0<i>%</i></div>
				<div class="loading__rule"><span id="loading-fill"></span></div>
				<div class="loading__read">
					<span class="loading__file">
						<i class="dot"></i><span id="loading-label">Avatar</span>
					</span>
					<span class="loading__bytes" id="loading-bytes">0.0 MB</span>
				</div>
				<button class="text-button loading__retry" id="loading-retry" hidden>
					Retry
				</button>
			</div>

			<p class="sr-only" id="loading-status">Loading avatar…</p>
		</div>

		<div id="screenshotable" inert>
			<canvas
				id="webgl"
				class="webgl"
				tabindex="0"
				role="application"
				aria-roledescription="3D avatar viewport"
				aria-label="Bilal, 3D preview"
				aria-describedby="viewport-help"
			></canvas>
			<p class="plate-caption" id="plate-caption"></p>
			<!-- Dips to the fog colour while a place is swapped. -->
			<div class="place-veil" id="place-veil" aria-hidden="true"></div>
		</div>

		<p id="viewport-help" class="sr-only">
			Drag, or use the left and right arrow keys, to turn the avatar. Scroll,
			pinch, or use the up and down arrow keys to zoom. Press question mark for
			all shortcuts.
		</p>

		<div class="console" id="console" role="group" aria-label="Viewer controls" inert>
			<button id="audio-play" type="button" aria-label="Play music">
				<span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
			</button>
			<button id="audio-mute" type="button" aria-label="Mute" aria-pressed="false">
				<span class="material-symbols-outlined" aria-hidden="true">volume_up</span>
			</button>
			<div class="console__slider">
				<input
					id="volume"
					type="range"
					min="0"
					max="100"
					step="5"
					value="30"
					aria-label="Volume"
				/>
			</div>

			<button id="pose" type="button" aria-label="Next pose">
				<span class="material-symbols-outlined" aria-hidden="true">sports_martial_arts</span>
			</button>
			<button id="environment" type="button" aria-label="Next place">
				<span class="material-symbols-outlined" aria-hidden="true">landscape</span>
			</button>
			<button id="light" type="button" aria-label="Next time of day">
				<span class="material-symbols-outlined" aria-hidden="true">wb_twilight</span>
			</button>
			<button id="shuffle" type="button" aria-label="Shuffle a random outfit">
				<span class="material-symbols-outlined" aria-hidden="true">shuffle</span>
			</button>
			<button id="reset-view" type="button" aria-label="Reset view">
				<span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
			</button>
			<button id="share" type="button" aria-label="Copy a link to this outfit">
				<span class="material-symbols-outlined" aria-hidden="true">link</span>
			</button>
			<button id="shortcuts-open" type="button" aria-label="Keyboard shortcuts">
				<span class="material-symbols-outlined" aria-hidden="true">keyboard</span>
			</button>

			<span class="console__divider" aria-hidden="true"></span>

			<button id="capture" type="button" class="capture" aria-label="Capture image">
				<span class="material-symbols-outlined" aria-hidden="true">photo_camera</span>
				<span class="capture__label">Capture</span>
			</button>

			<!-- Phone only: the floating side tab has nowhere to live at 390px. -->
			<button class="console__recall" id="panel-recall" type="button" aria-label="Open wardrobe">
				<span class="material-symbols-outlined" aria-hidden="true">checkroom</span>
			</button>
		</div>

		<button
			class="panel__tab"
			id="panel-toggle"
			type="button"
			inert
			aria-expanded="false"
			aria-controls="panel"
		>
			<span aria-hidden="true">Lookbook</span>
			<span class="sr-only">Wardrobe</span>
		</button>

		<aside class="panel collapsed" id="panel" aria-label="Wardrobe" inert>
			<header class="panel__head">
				<p class="panel__mark" id="panel-title">Bilal</p>
				<button class="text-button" id="panel-close" type="button">Close</button>
			</header>

			<div
				class="seg panel__tabs"
				id="panel-tabs"
				role="radiogroup"
				aria-label="Category"
			></div>

			<div class="sections" id="sections"></div>
		</aside>

		<dialog class="sheet" id="shortcuts" aria-labelledby="shortcuts-title">
			<div class="sheet__head">
				<h2 class="sheet__title" id="shortcuts-title">Keyboard shortcuts</h2>
				<button class="sheet__close" id="shortcuts-close" type="button" aria-label="Close">
					<span class="material-symbols-outlined" aria-hidden="true">close</span>
				</button>
			</div>
			<dl class="shortcuts" id="shortcuts-list"></dl>
		</dialog>

		<script type="module" src="./script.js"></script>
	</body>
</html>
