<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AVATAR CUSTOMIZER</title>
		<link rel="stylesheet" href="./style.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap"
			rel="stylesheet"
		/>

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
	</head>
	<body>
		<canvas class="webgl"></canvas>

		<div class="avatar-customizer-ui" id="avatar-customizer-ui">
			<div class="title">Customize your avatar</div>

			<div class="ui" id="ui"></div>
			<div class="buttons-container">
				<button class="customization-done" id="done">
					<span class="material-symbols-outlined" style="font-size: 36px">
						photo_camera
					</span>
				</button>

				<button id="sampleAnimationBtn">Play Animation</button>
			</div>
		</div>

		<script type="module" src="./script.js"></script>
	</body>
</html>
