<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>AVATAR CUSTOMIZER</title>
		<link rel="stylesheet" href="./style.css" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap"
			rel="stylesheet"
		/>

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
	</head>
	<body>
		<div id="screenshotable">
			<canvas id="webgl" class="webgl"> </canvas>
			<div class="clothing-names" id="clothing-names"></div>
		</div>

		<div class="avatar-customizer-ui unselectable" id="avatar-customizer-ui">
			<button class="toggle-collapse" id="toggle-collapse">
				UI
				<span class="material-symbols-outlined" id="toggle-collapse-icon">
					chevron_right
				</span>
			</button>
			<div class="ui" id="ui"></div>
		</div>

		<div class="buttons-container unselectable">
			<button id="startAudio">
				<span class="material-symbols-outlined" id="audio-play-icon">
					play_arrow
				</span>
			</button>
			<button id="muteAudio">
				<span class="material-symbols-outlined" id="audio-mute-icon">
					volume_up
				</span>
			</button>
			<div class="range-container">
				<input type="range" id="volumeControl" min="0" max="100" value="30" />
			</div>

			<button id="sampleAnimationBtn">
				<span class="material-symbols-outlined"> sports_martial_arts </span>
			</button>
			<button class="customization-done" id="take-screenshot">
				<span class="material-symbols-outlined" style="font-size: 36px">
					photo_camera
				</span>
			</button>
			<button id="reset">
				<span class="material-symbols-outlined"> restart_alt </span>
			</button>
		</div>

		<script type="module" src="./script.js"></script>
	</body>
</html>
